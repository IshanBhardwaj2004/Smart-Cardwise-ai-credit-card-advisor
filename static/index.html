<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Advisor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E2A47'/%3E%3Crect x='13' y='19' width='34' height='23' rx='4' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cline x1='13' y1='27' x2='47' y2='27' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='45' cy='43' r='10' fill='%2312A37A' stroke='%230E2A47' stroke-width='3'/%3E%3Cpath d='M40.5 43.2l3 3 5.5-6' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #F6F7F9;
    --surface: #FFFFFF;
    --raised: #FBFCFD;
    --ink: #101828;
    --body: #344054;
    --muted: #475467;
    --faint: #667085;
    --line: #E7EAEE;
    --line-soft: #EEF1F4;
    --field: #DDE2E8;
    --navy: #0E2A47;
    --green: #0A6B4F;
    --green-bg: #E6F4EE;
    --amber: #B54708;
    --amber-bar: #F79009;
    --amber-bg: #FFF6E5;
    --amber-ink: #7A4A00;
    --red: #B42318;
    --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .wrap { width: 100%; max-width: 820px; margin: 0 auto; padding: 0 24px; }

  /* header */
  header { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); }
  header .wrap { height: 72px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand b { font-size: 17px; letter-spacing: -0.01em; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #12A37A; }
  .new-chat {
    margin-left: auto; height: 40px; padding: 0 16px; border-radius: 12px;
    border: 1px solid #E0E4EA; background: var(--surface); color: var(--ink);
    font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  .new-chat:hover { background: var(--raised); }

  /* conversation */
  main { flex: 1; overflow-y: auto; }
  #chat { padding-top: 32px; padding-bottom: 24px; display: flex; flex-direction: column; gap: 22px; }
  .user {
    align-self: flex-end; max-width: min(460px, 85%);
    background: var(--navy); color: #FFFFFF; border-radius: 20px 20px 6px 20px;
    padding: 13px 18px; font-size: 15px; line-height: 1.55; white-space: pre-line;
    animation: rise 0.2s ease-out;
  }
  .bot { display: flex; gap: 12px; align-items: flex-start; animation: rise 0.25s ease-out; }
  .avatar {
    width: 32px; height: 32px; flex: none; border-radius: 10px; background: var(--green-bg);
    display: flex; align-items: center; justify-content: center; color: var(--green);
  }
  .bot-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .text { margin: 0; font-size: 16px; line-height: 1.65; white-space: pre-line; }
  .text.error { color: var(--red); }
  .note { margin: 0; font-size: 12px; color: var(--faint); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* card list */
  .results { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .results-head {
    display: flex; justify-content: space-between; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--line-soft); font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint);
  }
  .card-item { border-bottom: 1px solid var(--line-soft); }
  .card-item:last-child { border-bottom: 0; }
  .card-item.open { background: var(--raised); }
  .card-row { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
  .art { width: 52px; height: 34px; flex: none; border-radius: 6px; position: relative; }
  .art::after { content: ""; position: absolute; left: 7px; top: 9px; width: 10px; height: 8px; border-radius: 2px; background: rgba(255, 255, 255, 0.75); }
  .card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .card-name { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .card-sub { font-size: 13px; color: var(--muted); }
  .tag { font-size: 11px; font-weight: 700; color: var(--green); background: var(--green-bg); border-radius: 999px; padding: 3px 8px; }
  .tag.best { color: #FFFFFF; background: var(--green); }
  .headline { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--green); white-space: nowrap; }
  .headline.low { color: var(--muted); }
  .toggle {
    width: 36px; height: 36px; flex: none; border: none; border-radius: 10px;
    background: #F2F4F7; color: var(--body); display: flex; align-items: center; justify-content: center;
  }
  .toggle:hover { background: var(--line-soft); }
  .toggle svg { transition: transform 0.15s; }
  .card-item.open .toggle svg { transform: rotate(180deg); }
  .card-more { display: none; flex-direction: column; gap: 12px; padding: 0 18px 16px 84px; }
  .card-item.open .card-more { display: flex; }
  .figures {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px;
    padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-soft);
  }
  .figure { display: flex; flex-direction: column; gap: 2px; }
  .figure span:first-child { font-size: 12px; color: var(--faint); }
  .figure span:nth-child(2) { font-family: var(--mono); font-size: 15px; }
  .figure small { font-size: 11px; color: var(--faint); }
  .benefits { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5; color: var(--body); }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; }
  .action { padding: 0; border: 0; background: none; color: var(--green); font-size: 13px; font-weight: 600; }
  .action:hover { text-decoration: underline; }

  /* eligibility meter */
  .meter { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .meter-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .meter-head b { font-size: 15px; }
  .meter-status { font-size: 13px; font-weight: 600; color: var(--amber); }
  .meter.ok .meter-status { color: var(--green); }
  .track { height: 10px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
  .bar { height: 100%; border-radius: 999px; background: var(--amber-bar); transition: width 0.5s ease-out; }
  .meter.ok .bar { background: #12A37A; }
  .meter-legend { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
  .meter-legend b { font-family: var(--mono); color: var(--ink); }

  .warning {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px;
    background: var(--amber-bg); color: var(--amber-ink); font-size: 13px; line-height: 1.5;
  }
  .warning svg { flex: none; margin-top: 2px; }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #D6DCE3;
    background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500;
  }
  .chip:hover { border-color: var(--green); color: var(--green); }

  /* welcome */
  .welcome { padding: 24px 0 8px; display: flex; flex-direction: column; gap: 24px; animation: rise 0.3s ease-out; }
  .welcome h1 { margin: 0; font-size: 34px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; max-width: 18ch; }
  .welcome p { margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted); max-width: 56ch; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .tile {
    min-height: 116px; padding: 16px; border-radius: 16px; border: 1px solid #E3E7EC; background: var(--surface);
    text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 12px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .tile:hover { border-color: var(--green); transform: translateY(-2px); }
  .tile-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .tile-label { font-size: 14px; font-weight: 600; line-height: 1.35; }
  .welcome .note { text-align: left; }

  /* typing */
  .typing { display: flex; gap: 5px; padding: 12px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #98A2B3; animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

  /* composer */
  .composer { flex: none; padding-top: 12px; padding-bottom: 24px; }
  form {
    display: flex; align-items: center; gap: 10px; background: var(--surface);
    border: 1px solid var(--field); border-radius: 20px; padding: 8px 8px 8px 20px;
    box-shadow: 0 6px 24px rgba(16, 24, 40, 0.08);
  }
  form:focus-within { border-color: #98A2B3; }
  #input { flex: 1; min-width: 0; height: 44px; border: none; outline: none; background: transparent; color: var(--ink); font-size: 15px; }
  #send {
    width: 44px; height: 44px; flex: none; border: none; border-radius: 14px;
    background: var(--green); color: #FFFFFF; display: flex; align-items: center; justify-content: center;
  }
  #send:disabled { opacity: 0.4; cursor: default; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 720px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    header .wrap { height: 64px; }
    .new-chat span { display: none; }
    .new-chat { width: 44px; height: 44px; padding: 0; justify-content: center; }
    #chat { padding-top: 20px; gap: 18px; }
    .welcome h1 { font-size: 28px; }
    .text { font-size: 15px; }
    .avatar { display: none; }
    .card-row { padding: 14px; gap: 12px; }
    .art { display: none; }
    .results-head { padding: 10px 14px; font-size: 11px; }
    .headline { font-size: 17px; }
    .card-more { padding: 0 14px 14px; }
    .composer { padding-bottom: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="16" fill="#0E2A47"></rect>
      <rect x="13" y="19" width="34" height="23" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3"></rect>
      <line x1="13" y1="27" x2="47" y2="27" stroke="#FFFFFF" stroke-width="3"></line>
      <circle cx="45" cy="43" r="10" fill="#12A37A" stroke="#0E2A47" stroke-width="3"></circle>
      <path d="M40.5 43.2l3 3 5.5-6" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div class="brand"><b id="title">Card Advisor</b><span class="status" id="status"></span></div>
    <button type="button" class="new-chat" id="new-chat">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg>
      <span id="new-chat-label">New chat</span>
    </button>
  </div>
</header>

<main id="scroller">
  <div id="chat" class="wrap" aria-live="polite"></div>
</main>

<div class="composer wrap">
  <form id="form">
    <label for="input" class="sr-only">Message</label>
    <input id="input" type="text" autocomplete="off">
    <button id="send" type="submit" aria-label="Send message">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
  </form>
</div>

<script>
  const chat = document.getElementById('chat');
  const scroller = document.getElementById('scroller');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  // all text comes from the server (rules.json -> ui); this file is layout only
  let UI = { labels: {}, suggestions: [], followups: {}, card_actions: [], results_title: {}, results_value_title: {}, summary_metrics: [] };

  const SVG_NS = 'http://www.w3.org/2000/svg';
  // stroke icons, drawn with the current text colour
  const ICONS = {
    card: '<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18"/>',
    cart: '<path d="M4 5h2l2 10h10l2-7H7"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/>',
    plane: '<path d="M3 14l18-7-6 13-3-5-5-1z"/>',
    compare: '<path d="M12 4v16M5 8h14M7 8l-3 6h6zM17 8l-3 6h6z"/>',
    check: '<path d="M5 12l4 4 10-10"/>',
    chevron: '<path d="M6 9l6 6 6-6"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>',
  };
  // tile colours: background + icon colour, picked in order
  const TILE_TONES = [['#E6F4EE', '#0A6B4F'], ['#EAF1FB', '#1D4E89'], ['#FFF1E3', '#9A4A00'], ['#F1ECFA', '#5B3B99']];
  // card art colours, picked from the card's alias so a card always looks the same
  const ART_TONES = ['#1F2A37', '#E8833A', '#3D5A80', '#0A6B4F', '#7A3E9D', '#B42318', '#2E7D9A', '#8A6D1F'];

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }
  function icon(name, size = 18) {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('width', size); svg.setAttribute('height', size);
    svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2'); svg.setAttribute('stroke-linecap', 'round'); svg.setAttribute('stroke-linejoin', 'round');
    svg.innerHTML = ICONS[name] || '';
    return svg;
  }
  function tone(text) {
    let h = 0;
    for (const ch of text || '') h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return ART_TONES[h % ART_TONES.length];
  }
  function fill(template, cards) {
    const names = cards.map(c => c.name);
    return template.replace('{card}', names[0] || '').replace('{cards}', names.join(' and '));
  }

  // one id per chat, so the bot remembers its last question ("50k" = income)
  const newSessionId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  let sessionId = newSessionId();
  const scrollDown = () => { scroller.scrollTop = scroller.scrollHeight; };

  function addUser(text) {
    chat.appendChild(el('div', 'user', text));
    scrollDown();
  }

  function botShell() {
    const wrap = el('div', 'bot');
    const avatar = el('div', 'avatar');
    avatar.appendChild(icon('card'));
    const body = el('div', 'bot-body');
    wrap.append(avatar, body);
    chat.appendChild(wrap);
    return body;
  }

  // one card as a compact row; rewards and fees open on demand
  function cardItem(card, index, openFirst) {
    const item = el('div', 'card-item');
    const row = el('div', 'card-row');
    const art = el('div', 'art');
    art.style.background = tone(card.alias || card.name);

    const main = el('div', 'card-main');
    const name = el('div', 'card-name', card.name);
    if (card.badge) name.appendChild(el('span', 'tag best', card.badge));
    for (const t of card.tags || []) name.appendChild(el('span', 'tag', t));
    const byKey = Object.fromEntries((card.metrics || []).map(m => [m.key, m]));
    const summary = UI.summary_metrics.filter(k => byKey[k]).map(k => `${UI.labels[k]} ${byKey[k].value}`).join(' · ');
    main.append(name);
    if (summary) main.appendChild(el('span', 'card-sub', summary));
    row.append(art, main);

    const head = byKey[UI.headline_metric];
    if (head) row.appendChild(el('span', 'headline' + (head.highlight ? '' : ' low'), head.value));

    const more = el('div', 'card-more');
    const rest = (card.metrics || []).filter(m => m.key !== UI.headline_metric);
    if (rest.length) {
      const figures = el('div', 'figures');
      for (const m of rest) {
        const f = el('div', 'figure');
        f.append(el('span', '', m.label), el('span', '', m.value));
        if (m.detail) f.appendChild(el('small', '', m.detail));
        figures.appendChild(f);
      }
      more.appendChild(figures);
    }
    if (card.benefits && card.benefits.length) {
      const list = el('ul', 'benefits');
      for (const b of card.benefits) list.appendChild(el('li', '', b));
      more.appendChild(list);
    }
    const actions = el('div', 'actions');
    for (const a of UI.card_actions) {
      const btn = el('button', 'action', a.label);
      btn.type = 'button';
      btn.addEventListener('click', () => ask(fill(a.text, [card])));
      actions.appendChild(btn);
    }
    more.appendChild(actions);

    const toggle = el('button', 'toggle');
    toggle.type = 'button';
    toggle.appendChild(icon('chevron', 16));
    const setOpen = (open) => {
      item.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? UI.labels.hide_breakdown : UI.labels.show_breakdown);
    };
    toggle.addEventListener('click', () => setOpen(!item.classList.contains('open')));
    row.appendChild(toggle);
    item.append(row, more);
    setOpen(openFirst && index === 0 && rest.length > 0);
    return item;
  }

  function meterBlock(m) {
    const box = el('div', 'meter' + (m.meets ? ' ok' : ''));
    const head = el('div', 'meter-head');
    head.append(el('b', '', m.title), el('span', 'meter-status', m.status));
    const track = el('div', 'track');
    const bar = el('div', 'bar');
    bar.style.width = '0%';
    track.appendChild(bar);
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = (m.fill * 100) + '%'; }));
    const legend = el('div', 'meter-legend');
    const you = el('span', '', UI.meter.you + ': ');
    you.append(el('b', '', m.you), ' ' + UI.meter.per);
    const need = el('span', '', UI.meter.needed + ': ');
    need.append(el('b', '', m.needed), ' ' + UI.meter.per);
    legend.append(you, need);
    box.append(head, track, legend);
    return box;
  }

  function warningBlock(text) {
    const box = el('div', 'warning');
    box.append(icon('info', 16), el('span', '', text));
    return box;
  }

  function chipRow(items, cards) {
    const row = el('div', 'chips');
    for (const f of items) {
      if (f.min_cards && cards.length < f.min_cards) continue;
      const chip = el('button', 'chip', f.label);
      chip.type = 'button';
      chip.addEventListener('click', () => {
        if (f.fill) { input.value = f.fill; input.focus(); } else ask(fill(f.text, cards));
      });
      row.appendChild(chip);
    }
    return row.children.length ? row : null;
  }

  function addBot(data) {
    const body = botShell();
    body.appendChild(el('p', 'text', data.reply));
    if (data.meter) body.appendChild(meterBlock(data.meter));
    const cards = data.cards || [];
    if (cards.length) {
      const results = el('div', 'results');
      const head = el('div', 'results-head');
      head.append(el('span', '', UI.results_title[data.mode] || ''), el('span', '', UI.results_value_title[data.mode] || ''));
      results.appendChild(head);
      cards.forEach((c, i) => results.appendChild(cardItem(c, i, data.mode === 'recommend')));
      body.appendChild(results);
    }
    if (data.warning) body.appendChild(warningBlock(data.warning));
    if (!data.refused && !data.clarifying) {
      const chips = chipRow(UI.followups[data.mode] || [], cards);
      if (chips) body.appendChild(chips);
    }
    if (data.note) body.appendChild(el('p', 'note', data.note));
    scrollDown();
  }

  function addTyping() {
    const body = botShell();
    const dots = el('div', 'typing');
    dots.setAttribute('aria-label', 'Card Advisor is typing');
    dots.append(el('span'), el('span'), el('span'));
    body.appendChild(dots);
    scrollDown();
    return body.parentElement;
  }

  function showWelcome() {
    chat.replaceChildren();
    const box = el('section', 'welcome');
    box.append(el('h1', '', UI.welcome_title), el('p', '', UI.welcome));
    const tiles = el('div', 'tiles');
    UI.suggestions.forEach((s, i) => {
      const [bg, fg] = TILE_TONES[i % TILE_TONES.length];
      const tile = el('button', 'tile');
      tile.type = 'button';
      const ic = el('span', 'tile-icon');
      ic.style.background = bg; ic.style.color = fg;
      ic.appendChild(icon(s.icon || 'card'));
      tile.append(ic, el('span', 'tile-label', s.label));
      tile.addEventListener('click', () => ask(s.text));
      tiles.appendChild(tile);
    });
    box.appendChild(tiles);
    if (UI.welcome_footer) box.appendChild(el('p', 'note', UI.welcome_footer));
    chat.appendChild(box);
  }

  // send the message to the server and show the reply
  async function ask(text) {
    const message = text.trim();
    if (!message || send.disabled) return;
    const welcome = chat.querySelector('.welcome');
    if (welcome) welcome.remove();
    addUser(message);
    input.value = '';
    send.disabled = true;
    const typing = addTyping();
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: sessionId }),
      });
      if (!res.ok) throw new Error('Server returned ' + res.status);
      const data = await res.json();
      typing.remove();
      addBot(data);
    } catch (err) {
      typing.remove();
      botShell().appendChild(el('p', 'text error', UI.error));
      scrollDown();
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); ask(input.value); });
  document.getElementById('new-chat').addEventListener('click', () => {
    sessionId = newSessionId();
    showWelcome();
    input.focus();
  });

  // load the UI text first, then show the welcome
  async function start() {
    try {
      const res = await fetch('/api/ui');
      if (res.ok) UI = await res.json();
    } catch (err) {
      UI.error = 'Could not load the app. Please check the server is running.';
    }
    document.getElementById('title').textContent = UI.title || 'Card Advisor';
    document.getElementById('status').textContent = UI.status || '';
    document.getElementById('new-chat-label').textContent = UI.new_chat || 'New chat';
    input.placeholder = UI.placeholder || '';
    if (!UI.welcome) {
      chat.appendChild(el('p', 'text error', UI.error));
      return;
    }
    showWelcome();
    input.focus();
  }

  start();
</script>
</body>
</html>
